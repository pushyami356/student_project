deploymentMode: Monolithic

serviceAccount:
  create: false
  name: loki

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage_config:
    aws:
      region: eu-north-1
      bucketnames: student-cluster-loki-chunks-836003244254-eu-north-1
      s3forcepathstyle: false

  storage:
    type: s3
    bucketNames:
      chunks: student-cluster-loki-chunks-836003244254-eu-north-1
      ruler: student-cluster-loki-ruler-836003244254-eu-north-1
    s3:
      region: eu-north-1

  limits_config:
    allow_structured_metadata: true
    retention_period: 168h

  compactor:
    retention_enabled: true
    delete_request_store: s3

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 20Gi

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

minio:
  enabled: false

chunksCache:
  enabled: false
